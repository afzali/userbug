# مسیرِ ورود — مقدمهٔ خزشِ نقشه.
#
#   userbug map nepi-bug --from scenarios/nepi-bug/ورود.yml --remember crawler
#
# یا از صفحهٔ «نقشهٔ اپ» در رابط، با همین فایل در کشویی «مسیرِ ورود».
#
# ── چرا همه‌چیز زیر `when` است ──
#
# خزش دهها بار به خانه برمی‌گردد و بارِ دوم کاربر از قبل وارد است: فرمِ ورود
# اصلاً وجود ندارد و یک `fill`ِ بی‌شرط همان‌جا می‌شکند. پس هر تکه فقط وقتی
# اجرا می‌شود که لازم باشد.
#
# ── و چرا `{{identity}}` ──
#
# با `--remember <شناسه>`، بارِ اول کاربرِ تازه ساخته و در
# `knowledge/nepi-bug/credentials.json` ذخیره می‌شود؛ دفعه‌های بعد همین
# `{{identity}}` مقدارِ همان حساب را می‌گیرد. پس این فایل عوض نمی‌شود و
# حسابی که خزشِ قبلی پُرش کرده، خزشِ بعدی را عمیق‌تر می‌کند.
#
# بی `--remember`، هر خزش کاربرِ خالیِ تازه می‌سازد و نقشه سطحی می‌ماند.
name: ورود برای نقشه
status: draft
persona: pro
steps:
  - go: /

  - when:
      visible:
        label: ایمیل
        visible: true
      timeout: 6000
    then:
      - fill:
          label: ایمیل
          visible: true
        value: '{{identity.email}}'
      - fill:
          label: رمز عبور
          visible: true
        value: '{{identity.password}}'
      - click:
          role: button
          name: ورود / ثبت‌نام
          exact: true
          visible: true

  # فقط بارِ اولِ هر حساب: کدِ بازیابی یک بار نشان داده می‌شود
  - when:
      visible:
        label: کد بازیابی را در جای مطمئنی ذخیره کردم.
        visible: true
      timeout: 8000
    then:
      - check:
          label: کد بازیابی را در جای مطمئنی ذخیره کردم.
          visible: true
      - click:
          role: button
          name: ادامه
          exact: true
          visible: true
