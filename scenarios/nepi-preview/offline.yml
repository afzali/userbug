name: آفلاین — ادعای اصلی اپ
# `pro` عمدی است، نه سلیقه: در اجرای نخست با `novice` فرم با ایمیلِ خالی
# submit شد و مرورگر «Please fill out this field» نشان داد. تایپِ حرف‌به‌حرف
# روی بیلد تولیدی با hydration هم‌پوشانی می‌کند و مقدار بی‌صدا پاک می‌شود.
#
# این خودش می‌تواند نقصِ اپ باشد، ولی سنجیدنش کارِ این سناریو نیست — اینجا
# ثبت‌نام فقط مقدمه است. اگر روزی سناریوی جداگانه‌ای برایش نوشتیم، جایش
# همان‌جاست.
persona: pro
status: approved
timeout: 300000

# ── چرا این سناریو فقط روی این هدف معنا دارد ──
#
# نپی خودش را آفلاین‌محور می‌داند. آن ادعا تا وقتی سنجیده نشود فقط یک جملهٔ
# تبلیغاتی است — ولی روی سرور توسعه سنجیدنش **ناممکن** است، نه سخت: ویت
# ماژول‌ها را در لحظه از شبکه می‌دهد و `+layout.svelte` سرویس‌ورکر را فقط در
# حالت production ثبت می‌کند. روی هدف `nepi` این سنجش همیشه یافتهٔ قلابی
# می‌داد.
#
# ── چرا این‌قدر صبر می‌کنیم ──
#
# ثبت سرویس‌ورکر و پیش‌کش کردن فایل‌ها زمان می‌برد و هیچ نشانِ قابل‌اتکایی روی
# صفحه ندارد. اگر زودتر از تمام شدنش شبکه را قطع کنیم، «آفلاین نشد» یعنی «ما
# عجله کردیم» نه «اپ خراب است» — و یافتهٔ اشتباه از نبودِ یافته گران‌تر است.
# پس مکث‌ها سخاوتمندانه‌اند و عمداً.

steps:
  - as: باز کردن بیلد تولیدی
    clearState: true
  - go: /
  - expect: { url: "/login" }
  - wait: 3000
  - dismissBlockers: true

  # مکث پیش از پر کردن: روی بیلد تولیدی hydration می‌تواند ورودی را بازسازی کند
  # و مقدارِ تازه‌نوشته را ببرد.
  - as: ثبت‌نام — تا داده‌ای محلی داشته باشیم
    wait: 2000
  - fill:
      ایمیل: "{{identity.email}}"
      رمز عبور: "{{identity.password}}"
  - click: { role: button, name: "ورود / ثبت‌نام" }
  - expect: { visible: { role: heading, name: "کد بازیابی شما" }, timeout: 30000 }
  - dismissBlockers: true
  - check: { role: checkbox }
  - click: { role: button, name: "ادامه" }
  - expect: { url: "/contents", timeout: 30000 }
  - wait: 2000
  - dismissBlockers: true

  # فرصت دادن به سرویس‌ورکر برای پیش‌کش. بدون این، سنجشِ بعدی دربارهٔ زمان‌بندی
  # ما حرف می‌زند نه دربارهٔ اپ.
  - as: فرصت دادن به سرویس‌ورکر برای پیش‌کش
    wait: 6000

  - as: قطع شبکه
    offline: true
  - wait: 1000

  - as: ناوبری داخلی آفلاین باید کار کند
    go: /contents
  - wait: 3000
  - assert: { url: "/contents" }
    finding: >-
      اپ آفلاین‌محور پس از قطع شبکه حتی به مسیر داخلی خودش هم نمی‌رسد
    detail: >-
      سرویس‌ورکر روی بیلد تولیدی ثبت می‌شود، ولی اگر پوستهٔ اپ پیش‌کش نشده
      باشد، کاربرِ آفلاین صفحهٔ خطای مرورگر می‌بیند — یعنی همان ادعایی که اپ
      روی آن بنا شده برآورده نمی‌شود.

  - as: و پوستهٔ اپ باید رندر شود، نه صفحهٔ خطای مرورگر
    assert: { visible: { role: button, name: "فایل جدید", nth: 0 }, timeout: 10000 }
    finding: >-
      پس از قطع شبکه، پوستهٔ اپ رندر نشد
    detail: >-
      آدرس درست است ولی رابط نیامده. یعنی HTML از کش آمده و دارایی‌های لازم
      (اسکریپت یا فونت) نیامده‌اند — حالتی که کاربر آن را «اپ خراب شد»
      می‌فهمد، نه «اینترنت نیست».

  - as: وصل کردن دوباره شبکه
    offline: false
  - wait: 2000
  - dismissBlockers: true
