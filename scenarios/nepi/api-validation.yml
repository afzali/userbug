name: پاسخ خطای اعتبارسنجی سرور
status: approved

# نخستین سناریویی که سمت سرور را می‌سنجد.
#
# هیچ کاربری از راه UI فیلد نامعتبر نمی‌فرستد، ولی هر کلاینت قدیمی، هر درخواست
# نیمه‌کاره و هر باگِ جای دیگرِ اپ می‌تواند. مسیرهای خطای اعتبارسنجی همان‌هایی
# هستند که وقتی خراب‌اند، تا روزِ بد کسی نمی‌فهمد.
#
# داورِ خودکار در این سناریو دو کار می‌کند: پاسخ HTTP را می‌سنجد، و هر خطی که
# سرور در همان بازه در لاگ می‌نویسد را به همین قدم می‌چسباند.

steps:
  - as: باز کردن اپ تا نشست ساخته شود
    clearState: true
  - go: /
  - wait: 1500
  - dismissBlockers: true

  - as: درخواست ثبت‌نام با فیلد نامعتبر
    request:
      method: POST
      path: /auth/register
      json: { email: [نامعتبر], verifier: "vvvvvvvvvvvvvvvv" }
      saveAs: res

  - as: باید ۴۲۲ برگردد
    expect: { equals: ["{{vars.res.status}}", "422"] }

  - as: پاسخ خطا باید JSON معتبر باشد
    assert: { matches: ["{{vars.res.text}}", "^\\s*\\{"] }
    finding: >-
      پاسخ خطای اعتبارسنجی سرور با هشدار PHP آلوده می‌شود و دیگر JSON معتبر
      نیست؛ کلاینت به‌جای پیام ۴۲۲ یک خطای تجزیه می‌گیرد
    detail: >-
      در Http::str رشته‌های `"فیلد «$key» …"` نوشته شده‌اند. در PHP 8 بایت‌های
      بالای ۰x۷F کاراکترِ معتبرِ شناسه‌اند، پس «»» بلافاصله پس از $key جذبِ نام
      متغیر می‌شود و PHP دنبال متغیرِ ناموجودِ $key» می‌گردد. راه‌حل {$key} است.

  - as: نام فیلد باید در پیام خطا بیاید
    assert: { matches: ["{{vars.res.text}}", "email"] }
    finding: >-
      نام فیلد از پیام خطای سرور حذف شده — کاربر و کلاینت نمی‌فهمند کدام فیلد
      ایراد داشته
    detail: >-
      همان علتِ بالا: $key» به رشتهٔ خالی تبدیل می‌شود، پس پیام «فیلد « باید
      رشته باشد» بیرون می‌آید. این حتی وقتی display_errors خاموش است هم
      باقی می‌ماند.
