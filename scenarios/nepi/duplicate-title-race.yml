name: کلیک سریع روی «ساخت و باز کردن» با عنوان تکراری
persona: pro
status: approved
timeout: 300000

# ── چرا این باگ است و نه سلیقه ──
#
# یکتاییِ slug با یک `$effect` و ۵۰۰ میلی‌ثانیه تأخیر بررسی می‌شود، ولی دکمه
# فقط وقتی قفل می‌شود که `slugError` نشسته باشد. کاربری که تندتر از نیم‌ثانیه
# کلیک می‌کند از کنارِ اعتبارسنجی رد می‌شود و به‌جای پیام قابل‌فهم، خطای خامِ
# `UNIQUE constraint failed` می‌گیرد.
#
# ── چرا مسابقه نمی‌دهیم ──
#
# نسخهٔ اول این سناریو فقط وقتی یافته ثبت می‌کرد که کلیکش زودتر از بررسیِ
# ۵۰۰ میلی‌ثانیه‌ای بنشیند — و در دو اجرا از سه اجرا نمی‌نشست. یافتهٔ تصادفی،
# طبق قانون سوم پروژه، یافته نیست.
#
# پس به‌جای «بیا ببینیم می‌توانم رد شوم؟» می‌پرسیم «آیا اصلاً پنجرهٔ رد شدن
# وجود دارد؟» — یعنی دکمه پیش از پایان بررسی باز است و بعدش قفل می‌شود. این را
# بدون هیچ مسابقه‌ای می‌شود دید.
#
# ── تفاوت با نسخهٔ اسکریپتی ──
#
# آن نسخه هر دو مشاهده را در یک شرط ترکیب می‌کرد و یک یافته می‌ساخت. اینجا دو
# `assert` جداست، چون دو نقصِ متفاوت‌اند: «پنجرهٔ رد شدن هست» و «اعتبارسنجی
# هیچ‌وقت قفل نمی‌کند». دومی بدتر است و نباید زیر اولی پنهان شود.

steps:
  - as: ثبت‌نام و ورود به فهرست
    clearState: true
  - go: /
  - expect: { url: "/login" }
  - wait: 2000
  - dismissBlockers: true
  - fill:
      ایمیل: "{{identity.email}}"
      رمز عبور: "{{identity.password}}"
  - click: { role: button, name: "ورود / ثبت‌نام" }
  - expect: { visible: { role: heading, name: "کد بازیابی شما" }, timeout: 30000 }
  - dismissBlockers: true
  - check: { role: checkbox }
  - click: { role: button, name: "ادامه" }
  - expect: { url: "/contents", timeout: 30000 }
  - wait: 1500
  - dismissBlockers: true

  - as: سند اول با مسیر سالم
    when: { hidden: { role: button, name: "فایل جدید", nth: 0 }, timeout: 1500 }
    then:
      - click: { role: button, name: "Toggle Sidebar" }
      - wait: 600
  - click: { role: button, name: "فایل جدید", nth: 0 }
  - click: { role: tab, name: "فایل خالی جدید" }
  - fill: { selector: "#blank-title" }
    value: "دفتر روزانه"
  - wait: 1000
  - click: { role: button, name: "ساخت و باز کردن" }
  - expect: { url: "/content/", timeout: 30000 }

  - as: بازگشت به فهرست
    go: /contents
  - wait: 2000
  - dismissBlockers: true

  - as: همان عنوان را دوباره وارد کن
    when: { hidden: { role: button, name: "فایل جدید", nth: 0 }, timeout: 1500 }
    then:
      - click: { role: button, name: "Toggle Sidebar" }
      - wait: 600
  - click: { role: button, name: "فایل جدید", nth: 0 }
  - click: { role: tab, name: "فایل خالی جدید" }
  - fill: { selector: "#blank-title" }
    value: "دفتر روزانه"

  # مهلت کوتاه عمدی است: می‌خواهیم وضعیت دکمه را *داخل* بازهٔ بررسی ببینیم، نه
  # بعد از آن. اگر دکمه همان لحظه قفل بود، این assert می‌خورد و یافته‌ای ثبت
  # نمی‌شود — یعنی پنجرهٔ رد شدن وجود ندارد.
  - as: دکمهٔ ساخت در بازهٔ بررسی یکتایی قفل نیست
    assert: { disabled: { role: button, name: "ساخت و باز کردن" }, timeout: 300 }
    finding: >-
      دکمهٔ ساخت در بازهٔ بررسی یکتاییِ عنوان باز است و تنها پس از آن قفل
      می‌شود
    detail: >-
      یکتاییِ slug با ۵۰۰ میلی‌ثانیه تأخیر بررسی می‌شود، ولی دکمه فقط با نشستن
      slugError قفل می‌گردد. یعنی پنجره‌ای هست که کاربر می‌تواند از اعتبارسنجی
      رد شود و مستقیم به INSERT برسد — و آنچه می‌گیرد پیام خامِ
      UNIQUE constraint failed است.

  - as: و پس از پایان بررسی باید قفل شود
    wait: 1500
  - assert: { disabled: { role: button, name: "ساخت و باز کردن" }, timeout: 5000 }
    finding: >-
      عنوان تکراری حتی پس از پایان بررسیِ یکتایی هم دکمهٔ ساخت را قفل نکرد
    detail: >-
      این از حالت قبل بدتر است: آنجا فقط یک پنجرهٔ زمانی باز بود، اینجا
      اعتبارسنجی عملاً هیچ‌وقت جلوی کاربر را نمی‌گیرد.

  # آنچه کاربرِ عجول واقعاً می‌بیند. عمداً هیچ assertی ندارد چون نتیجه‌اش به
  # زمان‌بندی بستگی دارد؛ ولی داورِ خودکار هر خطای کنسول یا پاسخ ۵xx همین قدم
  # را می‌گیرد، و آن است که ارزش دارد.
  - as: و کاربری که در همان پنجره کلیک کند چه می‌بیند
    clickIfPresent: { role: button, name: "ساخت و باز کردن" }
  - wait: 3000
  - dismissBlockers: { expected: ["افزودن کتاب جدید"] }
