name: ورود با قدم‌های زبان طبیعی
persona: novice
status: approved

# نخستین سناریویی که `do:` دارد — قدم به فارسی، نه توصیف دقیق عنصر.
#
# نکتهٔ اصلی این سناریو کارکردش نیست، اقتصادش است: **بدون کلید مدل هم اجرا
# می‌شود**، چون مسیرش در `_learned/learned-login.json` کش شده. مدل فقط برای
# قدمی صدا زده می‌شود که هنوز یاد گرفته نشده یا امضای صفحه‌اش عوض شده.
#
# کش می‌گوید «کجا»، سناریو می‌گوید «چه». مقدارها اینجا می‌مانند تا هر اجرا
# هویت خودش را داشته باشد.

steps:
  - as: پاکسازی و باز کردن اپ
    clearState: true
  - go: /
  - expect: { url: "/login" }
  - wait: 2000
  - dismissBlockers: true

  - as: پر کردن فرم با قدم‌های زبان طبیعی
    do: ایمیل حساب را وارد کن
    value: "{{identity.email}}"
  - do: رمز عبور را وارد کن
    value: "{{identity.password}}"
  - do: دکمهٔ ورود یا ثبت‌نام را بزن

  - as: باید به صفحهٔ کد بازیابی برسیم
    expect: { visible: { role: heading, name: "کد بازیابی شما" }, timeout: 30000 }
