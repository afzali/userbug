name: رفتار اپ با داده زیاد
persona: pro
status: approved
timeout: 900000

# ── سؤالی که این سناریو می‌پرسد ──
#
# هر سناریوی دیگر با یک یا دو سند کار می‌کند. ولی کاربری که شش ماه از اپ
# استفاده کرده، صد سند دارد — و آن‌جاست که فهرست کند می‌شود، مرتب‌سازی
# می‌شکند، جست‌وجو چیزی پیدا نمی‌کند و صفحه‌بندی‌ای که وجود ندارد به چشم
# می‌آید.
#
# ── چرا از راه رابط، نه INSERT مستقیم ──
#
# با `query` می‌شد در یک ثانیه صد ردیف در دیتابیس ریخت، ولی آن داده **واقعی
# نیست**: نپی برای هر پاراگراف باید ردیف FTS بسازد و `sort_order` را خودش
# تخصیص دهد. دادهٔ دست‌ساز، سنجشِ جست‌وجو را به دروغ سبز می‌کند — و سنجشی که
# دروغ بگوید از نبودش بدتر است.
#
# پس همان‌طور ساخته می‌شود که کاربر می‌سازد: کلیک، تایپ، ذخیره. کند است و
# عمداً کند است.
#
# ── چرا `pro` ──
#
# اینجا هدف، سنجیدنِ رفتارِ تایپ نیست؛ رسیدن به حجم است. `novice` هر عنوان را
# حرف‌به‌حرف می‌نوشت و اجرا را چند برابر می‌کرد بدون اینکه چیز تازه‌ای بگوید.

steps:
  - as: ثبت‌نام و ورود به فهرست
    clearState: true
  - go: /
  - expect: { url: "/login" }
  - wait: 2000
  - dismissBlockers: true
  - fill:
      ایمیل: "{{identity.email}}"
      رمز عبور: "{{identity.password}}"
  - click: { role: button, name: "ورود / ثبت‌نام" }
  - expect: { visible: { role: heading, name: "کد بازیابی شما" }, timeout: 30000 }
  - dismissBlockers: true
  - check: { role: checkbox }
  - click: { role: button, name: "ادامه" }
  - expect: { url: "/contents", timeout: 30000 }
  - wait: 1500
  - dismissBlockers: true

  # عدد کوچک نگه داشته شده تا اجرا در چند دقیقه تمام شود. برای شکارِ جدی‌تر
  # همین عدد را بالا ببرید؛ سقف موتور ۵۰۰ است.
  - as: ساخت ۱۲ سند، همان‌طور که کاربر می‌سازد
    forEach: { var: i, times: 12 }
    then:
      - go: /contents
      - wait: 1200
      - dismissBlockers: true
      - when: { hidden: { role: button, name: "فایل جدید", nth: 0 }, timeout: 1500 }
        then:
          - click: { role: button, name: "Toggle Sidebar" }
          - wait: 600
      - click: { role: button, name: "فایل جدید", nth: 0 }
      - click: { role: tab, name: "فایل خالی جدید" }
      - fill: { selector: "#blank-title" }
        value: "یادداشت شمارهٔ {{vars.i}}"
      # صبر برای بررسی یکتاییِ عنوان؛ مسیر سالم را می‌خواهیم نه مسابقه
      - wait: 1000
      - click: { role: button, name: "ساخت و باز کردن" }
      - expect: { url: "/content/", timeout: 30000 }
      - wait: 1200
      - dismissBlockers: true
      - type:
          into: { selector: ".ProseMirror", nth: 0 }
          value: "متن سند {{vars.i}} — کلیدواژهٔ یگانه: پرنیان{{vars.i}}"
      - wait: 600
      - click: { role: button, name: "ذخیره" }
      - wait: 1800
      - dismissBlockers: true

  - as: هر ۱۲ سند باید در دیتابیس باشند
    query:
      sql: "SELECT COUNT(*) AS n FROM books"
      saveAs: books
  - assert: { equals: ["{{vars.books.0.n}}", "12"] }
    finding: >-
      از ۱۲ سندی که ساخته شد، {{vars.books.0.n}} تا در دیتابیس نشست
    detail: >-
      هر سند با مسیر سالم و پس از پایان بررسی یکتایی ساخته شد، پس گم شدنشان
      یعنی یا ذخیره در حجم می‌شکند یا ساخت بی‌صدا رد شده است.

  - as: و متنشان هم باید ذخیره شده باشد
    query:
      sql: "SELECT COUNT(*) AS n FROM paragraphs"
      saveAs: paras
  - assert: { matches: ["{{vars.paras.0.n}}", "^(1[2-9]|[2-9]\\d)"] }
    finding: >-
      برای ۱۲ سند فقط {{vars.paras.0.n}} پاراگراف ذخیره شد
    detail: >-
      هر سند یک پاراگراف متن گرفت و صریح ذخیره شد. کمتر بودن یعنی ذخیره در
      حجم جا می‌ماند — همان جنس نقصی که با یک یا دو سند هرگز دیده نمی‌شود.

  # ── چرا سنجش روی عنوانِ تایپ‌شده نبود ──
  #
  # نسخهٔ اول همین دو قدم، «یادداشت شمارهٔ 12» را روی صفحه می‌جست و دو یافته
  # داد. عکسِ همان قدم نشان داد هر ۱۲ سند سرِ جایشان هستند و اپ عنوان را
  # نرمال کرده: «شمارهٔ» شده «شماره» و رقم لاتین شده فارسی. یعنی هر دو یافته
  # قلابی بودند — همان تله‌ای که `nasty-titles.yml` قبلاً مستندش کرده بود.
  #
  # پس به‌جای رشتهٔ تایپ‌شده، شمارندهٔ خودِ اپ سنجیده می‌شود: عددی که کاربر
  # پایین فهرست می‌خواند و به نرمال‌سازیِ عنوان کاری ندارد.
  # شمارنده از متنِ کلِ صفحه خوانده می‌شود، نه با `getByText`: عدد و واژه در
  # دو عنصر جدا نشسته‌اند، پس هیچ عنصری تنها «۱۲ کتاب» را در خودش ندارد. و
  # regex هر دو دستگاه رقم را می‌پذیرد تا به نرمال‌سازیِ نمایش گره نخورد.
  - as: فهرست باید هر ۱۲ سند را بشمارد
    go: /contents
  - wait: 3000
  - dismissBlockers: true
  - set: { name: listText, from: { text: { selector: "body" } } }
  - assert: { matches: ["{{vars.listText}}", "(12|۱۲)\\s*کتاب"] }
    finding: >-
      فهرست هر ۱۲ سند را نشمرد
    detail: >-
      دیتابیس ۱۲ سند دارد (قدم قبل همین را تأیید کرد)، پس اگر شمارندهٔ فهرست
      عدد دیگری بگوید یعنی خواندنِ فهرست با تعداد می‌شکند — و کاربر آن را
      «سندم گم شد» می‌فهمد.

  - as: رفرش روی فهرستِ پرحجم
    reload: true
  - wait: 3000
  - dismissBlockers: true
  - set: { name: afterReload, from: { text: { selector: "body" } } }
  - assert: { matches: ["{{vars.afterReload}}", "(12|۱۲)\\s*کتاب"] }
    finding: >-
      پس از رفرش، فهرستِ پرحجم شمارشش را از دست داد
    detail: >-
      خواندنِ دوبارهٔ همان داده از دیتابیس محلی نباید با تعداد بشکند.
