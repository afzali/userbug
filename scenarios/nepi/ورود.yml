# مسیرِ ورود — ساختهٔ `userbug entry`.
#
# از روی: _drafts/آشنایی-آشنایی-با-سامانه.yml
# بی حسابِ ذخیره‌شده: هر اجرا کاربرِ تازه می‌سازد.
#
# ── چرا همه‌چیز زیر `when` است ──
#
# خزش ده‌ها بار به خانه برمی‌گردد و بارِ دوم کاربر از قبل وارد است: فرمِ
# ورود اصلاً وجود ندارد و یک `fill`ِ بی‌شرط همان‌جا می‌شکند.
#
# این فایل را در صفحهٔ نقشه، کشویی «مسیرِ ورود» انتخاب کنید.
name: ورود
status: draft
persona: pro
steps:
  - go: /
  - dismissBlockers:
      wait: 5000
  - when:
      visible:
        label: ایمیل
        visible: true
      timeout: 6000
    then:
      - fill:
          label: ایمیل
          visible: true
        value: "{{identity.email}}"
      - fill:
          label: رمز عبور
          visible: true
        value: "{{identity.password}}"
      - click:
          role: button
          name: ورود / ثبت‌نام
          exact: true
          visible: true
  - when:
      visible:
        label: کد بازیابی را در جای مطمئنی ذخیره کردم.
        visible: true
      timeout: 8000
    then:
      - check:
          label: کد بازیابی را در جای مطمئنی ذخیره کردم.
          visible: true
      - click:
          role: button
          name: ادامه
          exact: true
          visible: true
