# مسیرِ ورود — مقدمهٔ نقشه.
#
# `userbug map nepi2 --from scenarios/nepi2/ورود.yml`
#
# عمداً کوچک است. پیش‌نویسِ گشت (۸۰ قدم، با upload و کلیکِ تکراری) مقدمهٔ
# شکننده‌ای است؛ خزش هر بار که برمی‌گردد سرِ خانه همین قدم‌ها را دوباره
# می‌رود، پس هر قدمِ اضافه یعنی چند ثانیه ضرب در دهها برگشت.
#
# ── چرا همه‌چیز زیر `when` است ──
#
# خزش دهها بار به خانه برمی‌گردد و بارِ دوم کاربر از قبل وارد است: فرمِ ورود
# اصلاً وجود ندارد و یک `fill`ِ بی‌شرط همان‌جا می‌شکند. پس هر تکه فقط وقتی
# اجرا می‌شود که لازم باشد.
#
# هویت تازه است، پس هر خزش کاربرِ خودش را می‌سازد و خزشِ قبلی را آلوده
# نمی‌کند. بهایش: حسابِ خالی، یعنی نقشه صفحه‌های داده‌دار را کم‌تر می‌بیند.
# برای نقشهٔ غنی‌تر، سناریوی ورودی با حسابِ واقعی بنویسید و `--from` را به آن
# بدهید.
name: ورود برای نقشه
status: draft
persona: pro
steps:
  - go: /

  - when:
      visible:
        label: ایمیل
        visible: true
      timeout: 4000
    then:
      - fill:
          label: ایمیل
          visible: true
        value: '{{identity.email}}'
      - fill:
          label: رمز عبور
          visible: true
        value: '{{identity.password}}'
      - click:
          role: button
          name: ورود / ثبت‌نام
          exact: true
          visible: true

  # فقط بارِ اولِ هر حساب: کدِ بازیابی یک بار نشان داده می‌شود
  - when:
      visible:
        label: کد بازیابی را در جای مطمئنی ذخیره کردم.
        visible: true
      timeout: 6000
    then:
      - check:
          label: کد بازیابی را در جای مطمئنی ذخیره کردم.
          visible: true
      - click:
          role: button
          name: ادامه
          exact: true
          visible: true
