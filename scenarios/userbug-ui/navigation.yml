name: ناوبری بین صفحه‌های رابط
status: approved

# نخستین سناریوی یک هدفِ غیرِ نپی.
#
# کارش ساده است و عمداً ساده مانده: از فهرست پروژه‌ها وارد یک پروژه می‌شود و
# صفحه‌های فضای کاری را مثل کاربر باز می‌کند. ارزشش در چیزی است که همین حین
# **خودکار** سنجیده می‌شود — هر خطای جاوااسکریپت، هر promise رهاشده و هر پاسخ
# ۴xx/۵xx در همان قدم یافته می‌شود، بدون اینکه سناریو چیزی درباره‌شان بنویسد.
#
# روی هدفی بدون لاگ سرور و بدون سورس، این تنها لایهٔ رصد است.
#
# ── چرا نامِ پروژه در سناریو نیست ──
#
# روی نخستین کارت کلیک می‌شود، نه روی «nepi». این سناریو روی هر نصبی با هر
# فهرستی از پروژه‌ها باید کار کند؛ اسمِ سخت‌کدشده آن را به همین ماشین می‌بست.

steps:
  - as: باز کردن فهرست پروژه‌ها
    clearState: true
  - go: /
  - expect: { visible: { role: heading, name: "پروژه‌ها" } }

  - as: ورود به نخستین پروژه
    click: { role: link, name: "ورود به پروژه", nth: 0 }
  - expect: { url: "/projects/" }

  # عنوانِ این صفحه‌ها نامِ پروژه را در خود دارد («تریاژ nepi»)، پس تطبیق
  # زیررشته‌ای است. پیش‌فرضِ موتور `exact: true` است و عمداً هم همان مانده.
  - as: رفتن به تریاژ
    click: { role: link, name: "تریاژ" }
  - expect: { url: "/triage" }
  - expect: { visible: { role: heading, name: "تریاژ", exact: false } }

  - as: رفتن به مقایسه
    click: { role: link, name: "مقایسه" }
  - expect: { url: "/compare" }
  - expect: { visible: { role: heading, name: "مقایسهٔ اجراهای", exact: false } }

  - as: رفتن به سناریوها
    click: { role: link, name: "سناریوها", nth: 0 }
  - expect: { url: "/files" }
  - expect: { visible: { role: heading, name: "سناریوهای", exact: false } }

  - as: بازگشت با دکمهٔ back مرورگر
    back: true
  - expect: { url: "/compare" }

  - as: بازگشت به فهرست پروژه‌ها
    click: { role: link, name: "همهٔ پروژه‌ها" }
  - expect: { visible: { role: heading, name: "پروژه‌ها" } }
