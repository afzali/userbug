name: باز کردن خط زمانی یک اجرا
status: approved

# مسیری که واقعاً استفاده می‌شود: از داشبورد به روایت یک اجرا.
#
# این سناریو عمداً هیچ اجرایی شروع نمی‌کند. هدفِ تحت تست همان رابطی است که
# اجراها را می‌سازد، و سناریویی که دکمهٔ «اجرا» را بزند، هم فرآیند تازه
# می‌سازد و هم پوشهٔ `runs/` را باد می‌کند — یعنی خودش را در نتیجهٔ خودش
# دخالت می‌دهد.

steps:
  - as: باز کردن داشبورد
    clearState: true
  - go: /
  - expect: { visible: { role: heading, name: "اجرای سناریو مثل یک کاربر واقعی" } }

  - as: رفتن به خط زمانی نخستین اجرا
    click: { role: link, name: "دیدن خط زمانی", nth: 0 }
  - expect: { url: "/runs/" }
  - expect: { visible: { role: heading, name: "روایت کامل اجرا" } }

  - as: خط زمانی مشترک باید روی صفحه باشد
    expect: { visible: { role: heading, name: "خط زمانی مشترک" } }

  - as: رفرش نباید صفحه را خالی کند
    reload: true
  - expect: { visible: { role: heading, name: "روایت کامل اجرا" } }

  # «مقایسه» هم لینک سایدبار است و هم دکمهٔ همین صفحه، پس توصیفِ اسمی به دو
  # عنصر می‌خورد و موتور درست می‌شکند («این ایرادِ سناریو است، نه اپ»). دکمهٔ
  # صفحه با آدرسِ از‌پیش‌پرشده مشخص می‌شود.
  - as: دکمهٔ مقایسه باید اجرا را از پیش پر کند
    click: { selector: 'a[data-slot="button"][href^="/compare?a="]' }
  - expect: { url: "/compare\\?a=" }
  - expect: { visible: { role: heading, name: "مقایسهٔ دو اجرا" } }
